# Public deployment configuration: only this file and a private environment file
# are needed on the VM. Publish both Dockerfile targets before deploying.
x-database-environment: &database-environment
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the production environment file}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the production environment file}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment: *database-environment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: ${TOOLING_IMAGE:?Set TOOLING_IMAGE to the published tooling image and version}
    restart: "no"
    init: true
    environment: *database-environment
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the published application image and version}
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?Set a random session secret of at least 32 characters in the production environment file}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
